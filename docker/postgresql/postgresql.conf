# ============================================================================
# PostgreSQL Configuration for Distributed Secrets Vault
# ============================================================================
# This PostgreSQL instance serves as one of the user management nodes.


# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================

# Listen on all network interfaces (required for Docker containers)
listen_addresses = '*'

# Maximum number of concurrent client connections
max_connections = 200


# ============================================================================
# REPLICATION & HIGH AVAILABILITY
# ============================================================================

# WAL level must be 'replica' or higher for streaming replication
# This enables standby servers to receive and apply WAL changes
wal_level = replica

# Maximum number of concurrent WAL sender processes
# This determines how many standby servers can connect simultaneously
max_wal_senders = 10

# Maximum number of replication slots to retain WAL files for standbys
# Prevents premature deletion of WAL files needed by disconnected standbys
max_replication_slots = 10

# Allows read-only queries on standby servers during recovery
hot_standby = on

# Ensures transaction commits wait for WAL to be written to at least 1 standby
# Provides strong consistency guarantees at the cost of some latency
synchronous_commit = on

# Requires acknowledgment from ANY 1 of the named standby servers before commit
# This provides automatic failover capability without data loss
synchronous_standby_names = 'ANY 1 (postgres-1, postgres-2)'


# ============================================================================
# MEMORY CONFIGURATION
# ============================================================================

# Amount of memory used for caching data/indexes
# Recommended: 25% of total system RAM (adjusted for containerized deployment)
shared_buffers = 1GB

# Estimate of memory available for disk caching by the OS
# Used by query planner to estimate costs; does not allocate memory
# Set to ~50-75% of total system RAM
effective_cache_size = 3GB

# Memory used for internal sort operations and hash tables per query
# Increase if you frequently sort large datasets or perform complex joins
work_mem = 16MB

# Memory used for maintenance operations (VACUUM, CREATE INDEX, ALTER TABLE)
maintenance_work_mem = 256MB


# ============================================================================
# WRITE-AHEAD LOG (WAL) CONFIGURATION
# ============================================================================

# Enables continuous archiving and point-in-time recovery (PITR)
# WAL files are copied to archive location for backup purposes
archive_mode = on

# Command to execute to archive a WAL file segment
# %p = path of file to archive, %f = filename only
# Replace with actual backup destination (S3, NFS, etc.)
archive_command = 'test ! -f /var/lib/postgresql/archive/%f && cp %p /var/lib/postgresql/archive/%f'

# Target fraction (0.0-1.0) of checkpoint interval to complete checkpoint
# Higher values spread out checkpoint I/O load but may increase recovery time
checkpoint_completion_target = 0.9


# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================

# Enables the logging collector background process
# Required for log rotation and centralized log management
logging_collector = on

# Log all data modification statements (INSERT, UPDATE, DELETE, TRUNCATE, etc.)
# Critical for auditing user data changes in a secrets management system
log_statement = 'mod'

# Log each successful connection attempt (important for security auditing)
log_connections = on

# Log session termination (track connection lifecycle for monitoring)
log_disconnections = on

# Log duration of each completed statement
# Useful for identifying performance issues
log_duration = on

# Only log statements that take longer than this many milliseconds
# Set to 1000ms (1 second) to capture slow queries without excessive logging
log_min_duration_statement = 1000

# Include line numbers in log messages for easier debugging
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '


# ============================================================================
# SECURITY & AUTHENTICATION
# ============================================================================

# Requires SSL/TLS for client connections when properly configured
# Uncomment and configure certificates for production use
# ssl = on
# ssl_cert_file = '/path/to/server.crt'
# ssl_key_file = '/path/to/server.key'


# ============================================================================
# PERFORMANCE TUNING
# ============================================================================

# Enables query execution plan statistics collection
# Helps the planner make better decisions over time
# Note: May add slight overhead but improves long-term performance
default_statistics_target = 100

# Sets the planner's estimate of the cost of a non-sequentially-fetched disk page
# Lower for SSDs (1.1-2.0), default (4.0) for HDDs
# random_page_cost = 1.1