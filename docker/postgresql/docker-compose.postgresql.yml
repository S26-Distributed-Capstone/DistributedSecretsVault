# Run PostgreSQL with the DSV configuration
# Development: single node. Production multi-node will use a separate compose and docker/postgresql/postgresql.conf.
name: "PostgreSQL"

# Environment variables are loaded from ../../.env (project root)
# Copy .env.example to .env and configure as needed

services:
  postgres:
    image: postgres:18.2-alpine
    container_name: dsv-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dsv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-dsv}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
