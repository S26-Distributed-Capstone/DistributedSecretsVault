# Production PostgreSQL: one primary + two synchronous standbys for redundancy.
# Uses docker/postgresql/postgresql.conf (replication, archive, logging).
# Standbys use application_name postgres-1 and postgres-2 to match synchronous_standby_names.
#
# Environment variables are loaded from ../../.env (project root).
# Required: POSTGRES_PASSWORD, POSTGRES_REPLICATION_USER, POSTGRES_REPLICATION_PASSWORD.
name: "PostgreSQL (Production)"

services:
  postgres-primary:
    image: postgres:18.2-alpine
    container_name: dsv-postgres-primary
    hostname: postgres-primary
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-dsv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-dsv}
      - POSTGRES_REPLICATION_USER=${POSTGRES_REPLICATION_USER:-replicator}
      - POSTGRES_REPLICATION_PASSWORD=${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - postgres-primary-data:/var/lib/postgresql/data
      - postgres-archive:/var/lib/postgresql/archive
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./scripts/init-primary.sh:/docker-entrypoint-initdb.d/01-create-replication-user.sh:ro
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dsv-network

  postgres-1:
    image: postgres:18.2-alpine
    container_name: dsv-postgres-1
    hostname: postgres-1
    environment:
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_USER=${POSTGRES_USER:-dsv}
      - POSTGRES_DB=${POSTGRES_DB:-dsv}
      - POSTGRES_PRIMARY_HOST=postgres-primary
      - POSTGRES_REPLICATION_USER=${POSTGRES_REPLICATION_USER:-replicator}
      - POSTGRES_REPLICATION_PASSWORD=${POSTGRES_REPLICATION_PASSWORD}
      - REPLICA_NAME=postgres-1
    volumes:
      - postgres-1-data:/var/lib/postgresql/data
      - ./scripts/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    command: ["bash", "/scripts/replica-entrypoint.sh"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - dsv-network

  postgres-2:
    image: postgres:18.2-alpine
    container_name: dsv-postgres-2
    hostname: postgres-2
    environment:
      - PGDATA=/var/lib/postgresql/data
      - POSTGRES_USER=${POSTGRES_USER:-dsv}
      - POSTGRES_DB=${POSTGRES_DB:-dsv}
      - POSTGRES_PRIMARY_HOST=postgres-primary
      - POSTGRES_REPLICATION_USER=${POSTGRES_REPLICATION_USER:-replicator}
      - POSTGRES_REPLICATION_PASSWORD=${POSTGRES_REPLICATION_PASSWORD}
      - REPLICA_NAME=postgres-2
    volumes:
      - postgres-2-data:/var/lib/postgresql/data
      - ./scripts/replica-entrypoint.sh:/scripts/replica-entrypoint.sh:ro
    command: ["bash", "/scripts/replica-entrypoint.sh"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - dsv-network

volumes:
  postgres-primary-data:
  postgres-archive:
  postgres-1-data:
  postgres-2-data:

networks:
  dsv-network:
    driver: bridge
