# Run the Distributed Secrets Vault application individually
name: "Distributed Secrets Vault"

# Environment variables are loaded from ../../.env (project root)
# Copy .env.example to .env and configure as needed

services:
  app:
    build: ../..
    container_name: dsv-app
    env_file:
      - ../../.env
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
