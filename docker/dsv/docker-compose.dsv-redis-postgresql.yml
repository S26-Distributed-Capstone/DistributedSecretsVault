# Run the Distributed Secrets Vault application with Redis and PostgreSQL
name: "Distributed Secrets Vault + Redis + PostgreSQL"

# Environment variables are loaded from ../../.env (project root)
# Copy .env.example to .env and configure as needed

services:
  redis:
    image: redis:8.6-alpine
    container_name: dsv-redis
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-REDIS_PASSWORD}
    volumes:
      - redis-data:/var/lib/redis
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dsv-network

  postgres:
    image: postgres:18.2-alpine
    container_name: dsv-postgres
    ports:
      - "5432:5432"
    environment:
      - LANG=C.UTF-8
      - POSTGRES_USER=${POSTGRES_USER:-dsv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-dsv}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dsv-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: dsv-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://kafka:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - dsv-network

  app:
    build: ../..
    container_name: dsv-app
    env_file:
      - ../../.env
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-REDIS_PASSWORD}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dsv}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-dsv}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - dsv-network

volumes:
  redis-data:
  postgres-data:
  kafka-data:

networks:
  dsv-network:
    driver: bridge
