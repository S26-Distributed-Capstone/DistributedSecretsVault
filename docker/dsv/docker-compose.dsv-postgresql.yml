# Run the Distributed Secrets Vault application with Redis
name: "Distributed Secrets Vault + Redis"

# Environment variables are loaded from ../../.env (project root)
# Copy .env.example to .env and configure as needed

services:
  # TODO add postgresql
  app:
    build: ../..
    container_name: dsv-app
    env_file:
      - ../../.env
    ports:
      - "8080:8080"
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    networks:
      - dsv-network

networks:
  dsv-network:
    driver: bridge
