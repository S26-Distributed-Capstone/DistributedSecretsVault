# Run the Distributed Secrets Vault application with PostgreSQL
name: "Distributed Secrets Vault + PostgreSQL"

# Environment variables are loaded from ../../.env (project root)
# Copy .env.example to .env and configure as needed

services:
  postgres:
    image: postgres:18.2-alpine
    container_name: dsv-postgres
    ports:
      - "5432:5432"
    environment:
      - LANG=C.UTF-8
      - POSTGRES_USER=${POSTGRES_USER:-dsv}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-dsv}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - dsv-network

  app:
    build: ../..
    container_name: dsv-app
    env_file:
      - ../../.env
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-dsv}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-dsv}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dsv-network

volumes:
  postgres-data:

networks:
  dsv-network:
    driver: bridge
