# Same stack as docker-compose.dsv-redis-kafka.yml but with three DSV app instances.
# HTTP: localhost:8081 (app1), :8082 (app2), :8083 (app3)
name: "Distributed Secrets Vault + Redis + Kafka"

services:
  redis:
    image: redis:8.6-alpine
    container_name: dsv-redis
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-REDIS_PASSWORD}
    volumes:
      - redis-data:/var/lib/redis
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dsv-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: dsv-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT_HOST://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT_HOST://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT_INTERNAL
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_NUM_PARTITIONS=1
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 45s
    networks:
      - dsv-network

  app1:
    build: ../..
    container_name: dsv-app-1
    env_file:
      - ../../.env
    ports:
      - "8081:8080"
    environment:
      - NODE_NAME=node-1
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-REDIS_PASSWORD}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SEED_DNS_HOST=localhost
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - dsv-network

  app2:
    build: ../..
    container_name: dsv-app-2
    env_file:
      - ../../.env
    ports:
      - "8082:8080"
    environment:
      - NODE_NAME=node-2
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-REDIS_PASSWORD}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SEED_DNS_HOST=localhost
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - dsv-network

  app3:
    build: ../..
    container_name: dsv-app-3
    env_file:
      - ../../.env
    ports:
      - "8083:8080"
    environment:
      - NODE_NAME=node-3
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-REDIS_PASSWORD}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SEED_DNS_HOST=localhost
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - dsv-network

volumes:
  redis-data:
  kafka-data:

networks:
  dsv-network:
    driver: bridge
