# Run the Distributed Secrets Vault application with Redis
name: "Distributed Secrets Vault + Redis"

# Environment variables are loaded from ../../.env (project root)
# Copy .env.example to .env and configure as needed

services:
  redis:
    image: redis:8.6-alpine
    container_name: dsv-redis
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-REDIS_PASSWORD}
    volumes:
      - redis-data:/var/lib/redis
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - dsv-network

  app:
    build: ../..
    container_name: dsv-app
    env_file:
      - ../../.env
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD:-REDIS_PASSWORD}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dsv-network

volumes:
  redis-data:

networks:
  dsv-network:
    driver: bridge
