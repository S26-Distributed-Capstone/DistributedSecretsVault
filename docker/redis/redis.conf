# ============================================================================
# Redis Configuration for Distributed Secrets Vault
# ============================================================================
# This Redis instance serves as the PRIMARY STORAGE for a single application node.
# Each node runs its own isolated Redis instance storing its partition of data.


# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================

# Bind to all network interfaces (required for Docker containers)
# Since this is per-node storage, only the local application node should connect
bind 0.0.0.0

# Protected mode prevents external access when no password is set
# Should remain 'yes' to enforce authentication requirements
protected-mode yes


# ============================================================================
# SECURITY & AUTHENTICATION
# ============================================================================

# Redis password authentication
# Password configured via command line: --requirepass ${REDIS_PASSWORD}
# See docker-compose.yml for environment variable configuration
# When using this file for Redis configuration, uncomment and set:
# requirepass REDIS_PASSWORD

# Disable dangerous commands that could cause catastrophic data loss
# These commands delete all data and must be blocked in production
# NEVER enable these for primary storage in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""

# CONFIG must NOT be disabled when using Redis images that bundle modules (RediSearch,
# RedisBloom): those modules call CONFIG at load time and crash (SIGSEGV) if it is
# disabled. Restrict CONFIG via ACLs in production if needed.
# rename-command CONFIG ""

# Additional commands to consider disabling for production:
# rename-command KEYS ""      # Can cause performance issues on large datasets
# rename-command DEBUG ""     # Debugging commands that could affect stability


# ============================================================================
# PERSISTENCE CONFIGURATION
# ============================================================================
# Redis is primary storage - persistence MUST be enabled and reliable.
# Data loss in Redis means permanent data loss for this node's partition.

# Enable Append-Only File (AOF) persistence
# Logs every write operation to ensure durability
# Without this, all data is lost on restart
appendonly yes

# AOF fsync policy - determines when data is written to disk
# - always: fsync after every write (safest, recommended for primary storage)
# - everysec: fsync once per second (acceptable with ~1s potential data loss)
# - no: let OS decide when to fsync (NOT recommended for primary storage)
# Using 'everysec' as a balance - consider 'always' for maximum durability
appendfsync everysec

# Use RDB format for the AOF rewrite base to reduce file size
# Combines fast loading of RDB with AOF durability
aof-use-rdb-preamble yes

# RDB snapshot configuration: save <seconds> <changes>
# Multiple save points provide additional recovery options
# These work alongside AOF persistence for defense in depth
# 900 1 = after 15 min if at least 1 key changed; 300 10 = 5 min/10 keys; 60 10000 = 1 min/10000 keys
save 900 1
save 300 10
save 60 10000

# Directory where RDB snapshots and AOF files are stored
# Use /var/lib/redis (not /data) so the data dir does not contain redis.conf;
# some Redis Docker images put config in /data, causing "Unknown file" warnings.
# Ensure this directory has sufficient space and proper permissions.
dir /var/lib/redis

# Load truncated AOF file at startup
# If AOF is corrupted, try to load as much as possible
# 'yes' allows recovery from partial corruption (recommended)
aof-load-truncated yes

# Rewrite AOF file if size grows beyond threshold
# Keeps AOF file manageable by removing redundant commands
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb


# ============================================================================
# MEMORY MANAGEMENT
# ============================================================================
# For primary storage, prevent data loss by disabling automatic eviction.
# Application must handle out-of-memory conditions explicitly.

# Memory eviction policy when maxmemory limit is reached
# - noeviction: Return errors when memory limit is reached (REQUIRED for primary storage)
# - allkeys-lru: Evict least recently used keys (NEVER use for primary storage)
# - volatile-lru: Evict LRU keys with an expiration set
# - allkeys-random: Evict random keys (NEVER use for primary storage)
# - volatile-random: Evict random keys with expiration set
# - volatile-ttl: Evict keys with shortest TTL
# MUST use 'noeviction' to prevent automatic data loss
maxmemory-policy noeviction

# Maximum memory Redis can use
# Set based on node capacity and expected data volume
# Monitor usage and scale vertically/horizontally as needed
# Set to ~70-80% of allocated container memory
maxmemory 2gb


# ============================================================================
# PERFORMANCE TUNING
# ============================================================================
# Optimized for reliability and data integrity as primary storage

# Maximum number of connected clients
# For per-node storage, typically only the local application connects
# Set conservatively to prevent resource exhaustion
maxclients 50

# Close connection after client is idle for N seconds (0 = disable)
# Helps free up resources from inactive connections
# Can be more aggressive for per-node storage
timeout 300

# Send TCP keepalive messages to detect dead peers
# Recommended to enable to avoid accumulating dead connections
tcp-keepalive 300

# Number of databases (0-15 by default)
# Plan database usage based on application architecture
# Each database is isolated - choose appropriate database IDs for different data types
# TODO db 1 can be used for primary data, db 2 can be used for intermediate operations
databases 2


# ============================================================================
# SLOW LOG CONFIGURATION
# ============================================================================

# Log queries that take longer than this many microseconds
# 10000 microseconds = 10 milliseconds
# Helps identify performance bottlenecks
slowlog-log-slower-than 10000

# Maximum number of slow log entries to keep in memory
# Older entries are discarded when limit is reached
slowlog-max-len 128


# ============================================================================
# ADVANCED CONFIGURATION
# ============================================================================

# Use LZF compression for RDB snapshots
# Trades CPU for disk space (no network benefit since no replication)
# Recommended for efficient disk utilization
rdbcompression yes

# Enable RDB file checksum for corruption detection
# Performance penalty is acceptable for data integrity
rdbchecksum yes

# Disable Transparent Huge Pages (THP) warning
# THP can cause latency issues with Redis
# Set this on the host system: echo never > /sys/kernel/mm/transparent_hugepage/enabled

# Enable active memory defragmentation (Redis 4.0+)
# Helps reduce memory fragmentation over time
# Important for long-running primary storage instances
activedefrag yes

# Lazy freeing for improved performance
# Performs expensive deletions in a background thread
# Safe to enable for primary storage
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Stop writes if RDB/AOF background save fails
# CRITICAL: Prevents accepting writes when persistence is broken
# Ensures data loss cannot occur silently
stop-writes-on-bgsave-error yes
