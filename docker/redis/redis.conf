# Redis Configuration for Distributed Secrets Vault

# Persistence Configuration
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
dir /data

# Security
# Password configured via command line: --requirepass ${REDIS_PASSWORD}
# See docker-compose.yml
# When using this file for Redis configuration, use the following:
# requirepass REDISPASSWORD

# Network
bind 0.0.0.0
protected-mode yes

# Performance
maxmemory-policy noeviction
