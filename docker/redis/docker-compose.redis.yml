# Run Redis with the DSV configuration
name: "Redis"

# Environment variables are loaded from ../../.env (project root)
# Copy .env.example to .env and configure as needed

services:
  redis:
    image: redis:8.4
    container_name: dsv-redis
    ports:
      - "6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:-REDISPASSWORD}
    volumes:
      - redis-data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

volumes:
  redis-data:
