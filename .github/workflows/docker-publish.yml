# # Build and push distributed-secrets-vault to Docker Hub on version tags or manual dispatch.
# name: Publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (e.g. latest or v1.0.0)"
        required: true
        default: "latest"

env:
  DSV_IMAGE_NAME: distributed-secrets-vault

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.3.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Build application JAR
        run: |
          ./mvnw -B clean package -DskipTests
          mkdir -p target/dependency
          (cd target/dependency && jar -xf ../*.jar)

      - name: Resolve image tag
        id: meta
        env:
          DOCKER_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DSV_IMAGE_NAME }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.image_tag }}"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            if [[ "$TAG" == "latest" ]]; then
              echo "tags=$DOCKER_REPO:latest" >> "$GITHUB_OUTPUT"
            else
              echo "tags=$DOCKER_REPO:$TAG" >> "$GITHUB_OUTPUT"
            fi
          else
            VERSION=${GITHUB_REF_NAME#v}
            echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
            
            # Find the highest semantic version tag without needing a full clone
            HIGHEST_TAG=$(git ls-remote --tags origin "refs/tags/v*" | awk '{print $2}' | sed 's|refs/tags/||; s|\^{}||' | sort -V | tail -n 1)
            
            if [[ "${GITHUB_REF_NAME}" == "${HIGHEST_TAG}" ]]; then
              echo "tags=$DOCKER_REPO:$VERSION,$DOCKER_REPO:latest" >> "$GITHUB_OUTPUT"
            else
              echo "tags=$DOCKER_REPO:$VERSION" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
