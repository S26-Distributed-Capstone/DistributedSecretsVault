# This workflow runs all Maven tests on pull requests with test result and code coverage reporting
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Test Suite with Coverage

on:
  pull_request:
    branches: ["**"] # Run on PRs to any branch

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write  # Required to post PR comments
      checks: write         # Required for test reporter

    # TODO: Add Redis and PostgreSQL service containers when integration tests require them

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Run tests with Maven
        run: ./mvnw -B clean verify
        # TODO: Add SPRING_PROFILES_ACTIVE and service environment variables when needed

      - name: Publish test results
        uses: dorny/test-reporter@v2.5.0
        if: always()
        with:
          name: Maven Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Generate JaCoCo coverage report
        if: always()
        run: ./mvnw jacoco:report

      - name: Add coverage comment to PR
        uses: madrapps/jacoco-report@v1.7.2
        if: always()
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0
          title: Code Coverage Report
          update-comment: true
