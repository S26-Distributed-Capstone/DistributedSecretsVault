# This workflow runs all Maven tests on pull requests with test result and code coverage reporting
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: Test Suite with Coverage

on:
  pull_request:
    branches: ["**"] # Run on PRs to any branch

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write # Required to post PR comments
      checks: write # Required for test reporter

    # TODO: Add Redis and PostgreSQL service containers when integration tests require them

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5.2.0
        with:
          java-version: "25"
          distribution: "temurin"
          cache: maven

      - name: Run tests with Maven
        run: ./mvnw -B clean verify
        # TODO: Add SPRING_PROFILES_ACTIVE and service environment variables when needed

      - name: Publish test results
        uses: dorny/test-reporter@v3.0.0
        if: always()
        with:
          name: Maven Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Build testing report payload
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          icon_good=":white_check_mark:"
          icon_bad=":x:"
          icon_improve=":yellow_circle:"

          tests=0
          failures=0
          errors=0
          skipped=0
          duration=0

          if compgen -G "target/surefire-reports/*.xml" > /dev/null; then
            tests=$(grep -h -oE 'tests="[0-9]+"' target/surefire-reports/*.xml | sed -E 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}')
            failures=$(grep -h -oE 'failures="[0-9]+"' target/surefire-reports/*.xml | sed -E 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}')
            errors=$(grep -h -oE 'errors="[0-9]+"' target/surefire-reports/*.xml | sed -E 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}')
            skipped=$(grep -h -oE 'skipped="[0-9]+"' target/surefire-reports/*.xml | sed -E 's/[^0-9]//g' | awk '{s+=$1} END {print s+0}')
            duration=$(grep -h -oE 'time="[0-9]+(\.[0-9]+)?"' target/surefire-reports/*.xml | sed -E 's/[^0-9.]//g' | awk '{s+=$1} END {printf "%.2f", s+0}')
          fi

          passed=$((tests - failures - errors - skipped))
          if [[ ${passed} -lt 0 ]]; then
            passed=0
          fi

          if [[ "${JOB_STATUS}" == "success" ]]; then
            job_status_icon="${icon_good}"
          elif [[ "${JOB_STATUS}" == "cancelled" ]]; then
            job_status_icon="${icon_improve}"
          else
            job_status_icon="${icon_bad}"
          fi

          if [[ ${failures} -eq 0 && ${errors} -eq 0 ]]; then
            tests_status_icon="${icon_good}"
          else
            tests_status_icon="${icon_bad}"
          fi

          line_coverage="N/A"
          branch_coverage="N/A"
          instr_coverage="N/A"
          line_coverage_num=-1
          branch_coverage_num=-1
          instr_coverage_num=-1

          coverage_icon() {
            local value="$1"
            if (( value >= 85 )); then
              echo "${icon_good}"
            elif (( value >= 70 )); then
              echo "${icon_improve}"
            else
              echo "${icon_bad}"
            fi
          }

          if [[ -f target/site/jacoco/jacoco.xml ]]; then
            line_coverage=$(awk -F'"' '/<counter type="LINE"/ {m=$4; c=$6} END {t=m+c; if (t>0) printf "%.2f%%", (100*c)/t; else print "0.00%"}' target/site/jacoco/jacoco.xml)
            branch_coverage=$(awk -F'"' '/<counter type="BRANCH"/ {m=$4; c=$6} END {t=m+c; if (t>0) printf "%.2f%%", (100*c)/t; else print "0.00%"}' target/site/jacoco/jacoco.xml)
            instr_coverage=$(awk -F'"' '/<counter type="INSTRUCTION"/ {m=$4; c=$6} END {t=m+c; if (t>0) printf "%.2f%%", (100*c)/t; else print "0.00%"}' target/site/jacoco/jacoco.xml)

            line_coverage_num=${line_coverage%%%}
            branch_coverage_num=${branch_coverage%%%}
            instr_coverage_num=${instr_coverage%%%}
          fi

          if [[ ${line_coverage_num} == -1 ]]; then
            line_coverage_status="${icon_bad}"
            branch_coverage_status="${icon_bad}"
            instr_coverage_status="${icon_bad}"
          else
            line_coverage_status=$(coverage_icon "${line_coverage_num%.*}")
            branch_coverage_status=$(coverage_icon "${branch_coverage_num%.*}")
            instr_coverage_status=$(coverage_icon "${instr_coverage_num%.*}")
          fi

          cat > pr-test-report.md <<EOF
          ## Test And Coverage Report

          **Job status:** ${job_status_icon} ${JOB_STATUS}

          ### Test Status

          | Metric | Value | Status |
          | --- | --- | --- |
          | Total tests | ${tests} | - |
          | Passed | ${passed} | ${tests_status_icon} |
          | Failed | ${failures} | $([[ ${failures} -eq 0 ]] && echo "${icon_good}" || echo "${icon_bad}") |
          | Errors | ${errors} | $([[ ${errors} -eq 0 ]] && echo "${icon_good}" || echo "${icon_bad}") |
          | Skipped | ${skipped} | $([[ ${skipped} -eq 0 ]] && echo "${icon_good}" || echo "${icon_improve}") |
          | Total test duration (s) | ${duration} | - |

          ### Coverage Status

          | Metric | Value | Status |
          | --- | --- | --- |
          | Instruction coverage | ${instr_coverage} | ${instr_coverage_status} |
          | Branch coverage | ${branch_coverage} | ${branch_coverage_status} |
          | Line coverage | ${line_coverage} | ${line_coverage_status} |

          **Coverage thresholds:** ${icon_good} >= 85%, ${icon_improve} 70% to 84.99%, ${icon_bad} < 70%
          EOF

      - name: Update PR test report comment
        uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          header: test-and-coverage-report
          path: pr-test-report.md
