apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsv-app
  namespace: default
spec:
  # Max 12 nodes based on config. Missing nodes will stay pending (Standby behavior).
  replicas: 1
  serviceName: dsv-app-headless
  selector:
    matchLabels:
      app: dsv-app
  template:
    metadata:
      labels:
        app: dsv-app
    spec:
      containers:
        - name: dsv-app
          image: dsv-backend:latest
          ports:
            - containerPort: 4801
              name: cluster
            - containerPort: 8080
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CLUSTER_PORT
              value: "4801"
            - name: SEED_DNS_HOST
              value: "dsv-app-headless.default.svc.cluster.local"
            - name: SEED_DNS_PORT
              value: "4801"
            # Sidecar redis is reachable via localhost
            - name: SPRING_DATA_REDIS_HOST
              value: "localhost"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            # Postgres connection via the postgres primary service
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-0.postgres-headless.default.svc.cluster.local:5432/dsv"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dsv-secrets
                  key: POSTGRES_USER
                  optional: true
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dsv-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
        # Redis Sidecar container within the same Pod
        - name: redis-sidecar
          image: redis:8.6-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes"]
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
