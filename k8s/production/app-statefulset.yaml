apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsv-app
  namespace: dsv
spec:
  # One DSV pod per worker (10 workers). Scale replicas when adding workers.
  replicas: 10
  serviceName: dsv-app-headless
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: dsv-app
  template:
    metadata:
      labels:
        app: dsv-app
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - dsv-app
              topologyKey: kubernetes.io/hostname
      containers:
        - name: dsv-app
          image: dsv-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4801
              name: cluster
            - containerPort: 9080
              name: http
          env:
            - name: SERVER_PORT
              value: "9080"
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CLUSTER_PORT
              value: "4801"
            - name: SEED_DNS_HOST
              value: dsv-app-headless.dsv.svc.cluster.local
            - name: SEED_DNS_PORT
              value: "4801"
            - name: SPRING_DATA_REDIS_HOST
              value: localhost
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              value: ""
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.dsv.svc.cluster.local:9092
            # 10-node cluster: majority k=6, quorum m=6 (see scripts/demo-cluster-lifecycle.sh)
            - name: JAVA_TOOL_OPTIONS
              value: "-Dcluster.totalNodes=10 -Dcluster.thresholdK=6 -Dcluster.quorumM=6"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
        - name: redis-sidecar
          image: redis:8.6-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redis
          command: ["redis-server", "--appendonly", "yes"]
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
