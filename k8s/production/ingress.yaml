apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dsv-ingress
  namespace: dsv
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dsv-app-service
                port:
                  number: 9080
