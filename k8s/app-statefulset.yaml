apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dsv-app
  namespace: default
spec:
  # Max 12 nodes based on config. Missing nodes will stay pending (Standby behavior).
  replicas: 12
  serviceName: dsv-app-headless
  selector:
    matchLabels:
      app: dsv-app
  template:
    metadata:
      labels:
        app: dsv-app
    spec:
      # Ensure only one DSV worker per physical node (agent node)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - dsv-app
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: dsv-app
          image: dsv-backend:latest
          ports:
            - containerPort: 8080
          env:
            # Sidecar redis is reachable via localhost
            - name: SPRING_DATA_REDIS_HOST
              value: "localhost"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            # Postgres connection via the postgres primary service
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-0.postgres-headless.default.svc.cluster.local:5432/dsv"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dsv-secrets
                  key: POSTGRES_USER
                  optional: true
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dsv-secrets
                  key: POSTGRES_PASSWORD
                  optional: true
        # Redis Sidecar container within the same Pod
        - name: redis-sidecar
          image: redis:8.6-alpine
          ports:
            - containerPort: 6379
          command: ["redis-server", "--appendonly", "yes"]
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
