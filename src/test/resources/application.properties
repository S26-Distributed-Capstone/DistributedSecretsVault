# ============================================================================
# Test Profile - Distributed Secrets Vault
# ============================================================================
# Isolated schema per run, minimal logging, and fast timeouts for test execution.
# Activate with: SPRING_PROFILES_ACTIVE=test or in test class @ActiveProfiles("test")


# ============================================================================
# JPA / HIBERNATE CONFIGURATION (TEST)
# ============================================================================
# Clean database for each test run. Schema is created at startup and dropped at shutdown.

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/dsv
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Create schema at startup and drop at shutdown for full isolation
spring.jpa.hibernate.ddl-auto=create-drop

# Suppress SQL logging to keep test output readable
spring.jpa.show-sql=false


# ============================================================================
# CONNECTION TIMEOUTS (TEST)
# ============================================================================
# Shorter timeouts so tests fail quickly if Redis or PostgreSQL is unavailable.

# Redis connection timeout in milliseconds
spring.data.redis.timeout=5000

# HikariCP connection acquisition timeout in milliseconds
spring.datasource.hikari.connection-timeout=5000


# ============================================================================
# DATASOURCE CONNECTION POOL (HIKARICP) - TEST
# ============================================================================
# Smaller pool sizes to reduce resource usage during tests.

# Maximum connections in the pool
spring.datasource.hikari.maximum-pool-size=2

# Minimum idle connections to maintain
spring.datasource.hikari.minimum-idle=1


# ============================================================================
# REDIS CONNECTION POOL (TEST)
# ============================================================================
# Smaller pool sizes to reduce resource usage during tests.

# Maximum active connections in the Lettuce pool
spring.data.redis.lettuce.pool.max-active=2

# Maximum idle connections to retain
spring.data.redis.lettuce.pool.max-idle=2
spring.jpa.open-in-view=false
spring.jta.enabled=false
spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.orm.jdbc.error=FATAL
logging.level.com.zaxxer.hikari=ERROR
logging.level.org.hibernate.orm.deprecation=ERROR
