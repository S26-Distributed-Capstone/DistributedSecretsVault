# ============================================================================
# Spring Boot Configuration for Distributed Secrets Vault
# ============================================================================
# Base application settings. Profile-specific overrides in application-{profile}.properties.


# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================

spring.application.name=DistributedSecretsVault


# ============================================================================
# REDIS CONFIGURATION
# ============================================================================
# Redis is used for durable secret storage. Connection settings can be overridden via environment.

# Redis server host and port
# Override with SPRING_DATA_REDIS_HOST and SPRING_DATA_REDIS_PORT in Docker or .env
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Redis authentication password (required when Redis has requirepass set)
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:REDIS_PASSWORD}

# Logical database index (0-15). Use 0 for default.
spring.data.redis.database=0

# Connection timeout in milliseconds
spring.data.redis.timeout=60000


# ============================================================================
# REDIS CONNECTION POOL (LETTUCE)
# ============================================================================
# Lettuce client pool limits. Tune based on expected concurrency and Redis capacity.

# Maximum active connections that can be allocated from the pool
spring.data.redis.lettuce.pool.max-active=10

# Maximum idle connections to retain in the pool
spring.data.redis.lettuce.pool.max-idle=8

# Minimum idle connections to maintain in the pool
spring.data.redis.lettuce.pool.min-idle=0


# ============================================================================
# ACTUATOR CONFIGURATION
# ============================================================================
# Expose health, info, and metrics endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics

# Show detailed health check information (shows Redis and ScaleCube components)
management.endpoint.health.show-details=always

# Enable Kubernetes specific liveness and readiness probe endpoints
management.endpoint.health.probes.enabled=true


# ============================================================================
# KAFKA CONFIGURATION
# ============================================================================
# Kafka is used for request coordination (2PC) tie-breaking and ordering.

# Kafka broker connection
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer Group
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:dsv-coordination-group-${NODE_NAME:${random.uuid}}}

# Default serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.auto-offset-reset=earliest
