# ============================================================================
# Spring Boot Configuration for Distributed Secrets Vault
# ============================================================================
# Base application settings. Profile-specific overrides in application-{profile}.properties.


# ============================================================================
# APPLICATION CONFIGURATION
# ============================================================================

spring.application.name=DistributedSecretsVault


# ============================================================================
# POSTGRESQL CONFIGURATION (USER ACCOUNTS)
# ============================================================================
# PostgreSQL is used to manage user accounts across the system.
# Connection settings can be overridden via environment variables (see .env.example).

# JDBC URL for the PostgreSQL database
# Override with SPRING_DATASOURCE_URL in Docker or .env
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dsv}

# Database username and password
# Override with SPRING_DATASOURCE_USERNAME/PASSWORD or POSTGRES_USER/POSTGRES_PASSWORD
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:dsv}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:POSTGRES_PASSWORD}}

# JDBC driver class (required for PostgreSQL)
spring.datasource.driver-class-name=org.postgresql.Driver


# ============================================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================================
# Controls how Hibernate maps entities to the PostgreSQL schema and runs at startup.

# Dialect for PostgreSQL-specific SQL and types
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema management at startup: validate = check only, no create/alter (safe for production)
# Use 'update' in dev or 'create-drop' in test via profile-specific properties
spring.jpa.hibernate.ddl-auto=validate

# Log executed SQL to the console (disable in production to reduce noise)
spring.jpa.show-sql=false


# ============================================================================
# DATASOURCE CONNECTION POOL (HIKARICP)
# ============================================================================
# HikariCP pools JDBC connections to PostgreSQL. Tune based on concurrency and DB capacity.
# PostgreSQL max_connections must be greater than the sum of pool sizes across all app instances.

# Maximum number of connections in the pool
spring.datasource.hikari.maximum-pool-size=10

# Minimum number of idle connections to maintain
spring.datasource.hikari.minimum-idle=5

# Maximum time in milliseconds to wait for a connection from the pool
spring.datasource.hikari.connection-timeout=30000

# Maximum time in milliseconds that a connection can sit idle in the pool before being removed
spring.datasource.hikari.idle-timeout=600000

# Maximum lifetime in milliseconds of a connection in the pool (0 = no limit)
spring.datasource.hikari.max-lifetime=1800000


# ============================================================================
# REDIS CONFIGURATION
# ============================================================================
# Redis is used for durable secret storage. Connection settings can be overridden via environment.

# Redis server host and port
# Override with SPRING_DATA_REDIS_HOST and SPRING_DATA_REDIS_PORT in Docker or .env
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Redis authentication password (required when Redis has requirepass set)
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:REDIS_PASSWORD}

# Logical database index (0-15). Use 0 for default.
spring.data.redis.database=0

# Connection timeout in milliseconds
spring.data.redis.timeout=60000


# ============================================================================
# REDIS CONNECTION POOL (LETTUCE)
# ============================================================================
# Lettuce client pool limits. Tune based on expected concurrency and Redis capacity.

# Maximum active connections that can be allocated from the pool
spring.data.redis.lettuce.pool.max-active=10

# Maximum idle connections to retain in the pool
spring.data.redis.lettuce.pool.max-idle=8

# Minimum idle connections to maintain in the pool
spring.data.redis.lettuce.pool.min-idle=0


# ============================================================================
# ACTUATOR CONFIGURATION
# ============================================================================
# Expose health, info, and metrics endpoints over HTTP
management.endpoints.web.exposure.include=health,info,metrics

# Show detailed health check information (shows Redis, Postgres, ScaleCube components)
management.endpoint.health.show-details=always

# Enable Kubernetes specific liveness and readiness probe endpoints
management.endpoint.health.probes.enabled=true


# ============================================================================
# KAFKA CONFIGURATION
# ============================================================================
# Kafka is used for request coordination (2PC) tie-breaking and ordering.

# Kafka broker connection
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer Group
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:dsv-coordination-group}

# Default serializers
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
