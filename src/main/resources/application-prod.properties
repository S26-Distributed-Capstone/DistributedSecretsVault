# ============================================================================
# Production Profile - Distributed Secrets Vault
# ============================================================================
# Cluster size for the default 10-node production StatefulSet (overridden by JAVA_TOOL_OPTIONS in k8s).
cluster.totalNodes=10
cluster.thresholdK=3
cluster.quorumM=5

# HTTP API port (override with SERVER_PORT env in Kubernetes)
server.port=9080

logging.level.edu.yu.capstone=INFO

cluster.lockTimeoutMillis=30000
cluster.writeTimeoutMillis=10000
