# ============================================================================
# Single-Node + Redis Profile - Distributed Secrets Vault
# ============================================================================
# Single-node runtime with Redis-backed secret storage (no JDBC/JPA).

# Cluster settings: 1 node, 1-of-1 shards, quorum 1
cluster.totalNodes=1
cluster.thresholdK=1
cluster.quorumM=1

# Disable JDBC/JPA auto-config for this profile
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
