# ============================================================================
# Development Profile - Distributed Secrets Vault
# ============================================================================
# Relaxed schema management, verbose logging, and local-friendly defaults.
# Activate with: SPRING_PROFILES_ACTIVE=dev or --spring.profiles.active=dev


# ============================================================================
# JPA / HIBERNATE CONFIGURATION (DEVELOPMENT)
# ============================================================================
# Allow Hibernate to create or update tables to match entities during development.
# Avoids manual migrations while iterating on the schema.

# Create or update tables at startup; never drop existing tables or data
spring.jpa.hibernate.ddl-auto=update

# Log all executed SQL to the console for debugging
spring.jpa.show-sql=true

# Pretty-print SQL in logs (one clause per line)
spring.jpa.properties.hibernate.format_sql=true


# ============================================================================
# LOGGING CONFIGURATION (DEVELOPMENT)
# ============================================================================
# Verbose logging to aid debugging. Reduce in production.

# Application package logging level
logging.level.edu.yu.capstone=DEBUG

# Hibernate SQL logging (statements only)
logging.level.org.hibernate.SQL=DEBUG

# Hibernate parameter binding (bind values in SQL logs)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
